# ==========================================================================
#  spark-qwen38 -- the recommended profile (Qwen3.8-27B)
# ==========================================================================
#  This is what a DGX Spark is expected to arrive with, and what a bare
#  install means. Committed on purpose: the point of a profile is that the
#  configuration which produced a given machine is recoverable later.
#
#  Use it:   ./install.sh --profile profiles/spark-qwen38.conf
#  Inspect:  ./install.sh --profile profiles/spark-qwen38.conf --print-config
#
#  WHAT IS NOT HERE, AND WHY
#
#  1. HOST FACTS are detected, not set. The docker bridge gateway and the
#     dashboard bind address differ per machine. Pinning them here would make
#     this file wrong on some Sparks. Override with --host-bridge-ip / --bind-ip
#     if detection ever picks the wrong one.
#
#  2. SECRETS are never here. The dashboard password is generated at install
#     into a mode-0600 file outside the repo. Only the username is policy.
#
#  3. FORCED VALUES are not knobs. The provider wiring, the onboard flag set
#     (including the closed stdin that commit a31b7f1 exists for), the egress
#     policy step, marlin, MAX_JOBS/NVCC_THREADS, and the refusal to use
#     docker compose each have exactly one correct value, discovered the hard
#     way. They live in the scripts. `--print-config` lists them so you can
#     see what you are not being offered.
# ==========================================================================

PROFILE_NAME=spark-qwen38
PROFILE_VERSION=1

# local  -- this machine serves the model on its own GPU. Supports the claim
#           that nothing you type leaves the machine.
# remote -- inference lives elsewhere; phase 1 is skipped.
INFERENCE_MODE=local

# --- model ----------------------------------------------------------------
# Tool calling: a 4-case spot check passed 4/4. The 50-case tool-call harness
# has not been run against this model yet.
MODEL_DIR=$HOME/models/unsloth_Qwen3.8-27B-NVFP4
# Where to fetch it from if MODEL_DIR is missing or incomplete. The
# installer NEVER re-downloads a model that is already complete.
MODEL_REPO=unsloth/Qwen3.8-27B-NVFP4
SERVED_MODEL_NAME=qwen38

# Must match the model family AND be a parser vLLM has registered.
# gemma4 | llama3_json | hermes (Qwen3 dense) | qwen3_coder
TOOL_CALL_PARSER=qwen3_coder

# Validated >= 64000. Hermes refuses to start the agent below that.
MAX_MODEL_LEN=65536

# Output cap. Without it Hermes asks for the whole window.
AGENT_MAX_TOKENS=8192

# Hard cgroup cap so a bad model load kills the container, not the host.
MEM_CAP=88g

# Conservative on purpose -- leaves unified memory for the agent image build
# and the host. Raising it buys KV cache (more concurrent sessions) on a
# machine dedicated to this; measure before changing.
GPU_MEMORY_UTILIZATION=0.55

# --- vLLM image -----------------------------------------------------------
# Built from images/Dockerfile.vllm-spark: NVIDIA's NGC vLLM, pinned by digest.
VLLM_IMAGE=exx-vllm-spark:0.24.0-xgrammar021

# --- containers and ports -------------------------------------------------
VLLM_CONTAINER=hermes-spark-vllm
VLLM_PORT=8000
SANDBOX_NAME=hermes-demo

# The dashboard binds loopback on CONTROL_UI_PORT; the authenticated proxy
# listens on DASHBOARD_PUBLIC_PORT. They must differ.
CONTROL_UI_PORT=18795
DASHBOARD_PUBLIC_PORT=18796

# The OpenShell gateway port on this host.
NEMOCLAW_GATEWAY_PORT=8080

# --- dashboard auth -------------------------------------------------------
# Password on by default: this is the configuration a machine SHIPS with, and a
# machine a customer can reach must not arrive open. Set to `none` only on an
# isolated box. Auth is this repo's addition, not part of Hermes.
DASHBOARD_AUTH=basic
DASHBOARD_AUTH_USER=hermes

# Desktop app sign-in: enable the dashboard `basic` auth provider so the
# Hermes Desktop Remote Gateway has something to sign into. none = disable.
DESKTOP_CLIENT_AUTH=none

VLLM_EXTRA_ARGS=--reasoning-parser qwen3
